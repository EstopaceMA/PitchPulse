# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Azure Developer CLI template: `azd up` provisions infra/ with Terraform and deploys the web container.
# See "Deploy to Azure" in README.md.
name: pitchpulse
metadata:
  template: pitchpulse-aca-terraform@0.1.0
infra:
  provider: terraform
  path: infra
services:
  web:
    project: ./src/web
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile
      # Build in Azure Container Registry; azd falls back to local Docker if the remote build fails.
      remoteBuild: true
